<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistemas de Informação</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="img/icon.png" type="image/x-icon">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js" defer></script>
</head>

<body>
  <script>
    if (localStorage.getItem('tema') === 'claro') {
      document.body.classList.add('tema-claro');
    }
  </script>
  <header class="topo">
    <div class="container-topo">
      <a href="index.html" class="link-logo" aria-label="Sistemas de Informação - Início">
        <img src="img/logo-si.png" alt="Logo de Sistemas de Informação" class="logo-principal">
      </a>

      <nav aria-label="Navegação Principal">
        <a href="index.html">Início</a>
        <button id="btn-tema" type="button">Tema</button>
      </nav>
    </div>
  </header>
  <main>
    <section class="hero-curso">
      <h1>Sistemas de Informação</h1>
      <p>Turma de 2024</p>
    </section>
    <div id="grade" class="grade" aria-label="Disciplinas do Curso"></div>
    <!-- Seção CRUD: Feedback dos Visitantes -->
    <section class="secao-crud" aria-label="Comentários dos Visitantes">
      <h2>O que você achou interessante no portal?</h2>
      <p class="crud-subtitulo">Deixe sua opinião.</p>

      <form id="form-feedback" class="crud-form">
        <input type="text" id="input-nome" placeholder="Seu nome (opcional)" maxlength="40">

        <textarea id="input-mensagem" rows="3" maxlength="200" placeholder="Escreva aqui o que achou interessante..."
          required></textarea>

        <div class="crud-rodape-form">
          <span id="contador-caracteres" class="contador">0 / 200 caracteres</span>
          <div class="crud-botoes-form">
            <button type="button" id="btn-cancelar-edicao" class="botao-secundario" hidden>Cancelar</button>
            <button type="submit" id="btn-enviar-feedback" class="botao">Enviar Comentário</button>
          </div>
        </div>
      </form>

      <!-- Lista onde os comentários (Read) vão aparecer -->
      <div id="lista-feedbacks" class="lista-feedbacks"></div>
    </section>
  </main>
  <footer class="rodape">
    <p>&copy; 2026 Curso de Sistemas de Informação - Isulpar</p>
  </footer>

</body>

</html>
